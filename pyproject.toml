[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyllama-copilot"
version = "0.2.0"
description = "TinyLlama-1.1B fine-tuned with LoRA for shell commands, with dry-run safety and an LLM-as-judge evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sneha Kumari" }]
keywords = ["llm", "lora", "peft", "tinyllama", "cli", "fine-tuning", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "transformers>=4.39,<4.42",
    "peft>=0.10,<0.11",
    "accelerate>=0.30.1",
    "datasets>=2.19,<2.20",
    "torch>=2.3.0",
    "rouge-score",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
tinyllama-cli = "tinyllama_copilot.agent:main"
tinyllama-train = "tinyllama_copilot.train:main"
tinyllama-collect = "tinyllama_copilot.collect_data:main"
tinyllama-split = "tinyllama_copilot.split_data:main"
tinyllama-eval-static = "tinyllama_copilot.eval_static:main"
tinyllama-eval-dynamic = "tinyllama_copilot.eval_dynamic:main"
tinyllama-mean = "tinyllama_copilot.mean_score:main"

[project.urls]
Repository = "https://github.com/snehakumari1996/TinyLlama_LoRA_CLI_Copilot"
Issues = "https://github.com/snehakumari1996/TinyLlama_LoRA_CLI_Copilot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinyllama_copilot = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/tinyllama_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["src"]
